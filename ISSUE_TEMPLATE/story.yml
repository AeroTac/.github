name: Story
description: A clearly bounded user story under a feature; fits in one sprint.
title: "<short story title>"
type: Story
body:
  - type: markdown
    attributes:
      value: "Write in English. Fill every project field you can at creation (Status, Kind, Meets, Estimate min, WSJF inputs, Start and Target date, PI field, the milestone of its epic) and link the parent feature as a sub-issue. A ticket reaches Integrated only with every field filled, Test evidence included."
  - type: textarea
    id: story
    attributes:
      label: User story
      description: "As <role> I want <capability>, so that <benefit>."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "One checkbox per criterion, e.g. '- [ ] Refuses X with reason Y'. Tick it when its test is green."
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: "The requirement ids this story meets, one per line; the same ids go into the project field Meets."
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: "Every ADR, document and section this story changes or relies on, one per line with its path and section. Write 'none' only if none, never leave it out."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: "What this deliberately does not cover. Write 'none' if none."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Why this exists and where it comes from: owner decisions (quote and date), Hindsight records, documents, related tickets. Needed later for Flightplan."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: "Tickets or branches this depends on, and what depends on it. Write 'none' if none."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Test evidence
      description: "Filled when the story is closed: for each acceptance criterion, the test that proves it (file and test name) and the commit it ran green on."
    validations:
      required: false
