name: Story
description: A clearly bounded user story under a feature; fits in one sprint.
title: "<short story title>"
body:
  - type: markdown
    attributes:
      value: "Write in English. Fill every project field you can at creation (Status, Kind, Meets, Estimate min, WSJF inputs, Start and Target date, PI milestone) and link the parent feature as a sub-issue. A ticket reaches Integrated only with every field filled."
  - type: textarea
    id: story
    attributes:
      label: User story
      description: "As <role> I want <capability>, so that <benefit>."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "One checkbox per criterion, e.g. '- [ ] Refuses X with reason Y'. Tick it when its test is green."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Why this exists and where it comes from: requirement ids (Manifest), owner decisions (quote and date), Hindsight records, documents, related tickets. Needed later for Flightplan."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: "Tickets or branches this depends on, and what depends on it. Write 'none' if none."
    validations:
      required: true
