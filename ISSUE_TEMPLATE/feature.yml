name: Feature
description: A part of a product's work with its Pflichtenheft entries; not bound to one PI, need not sit under an epic.
title: "<feature title>"
type: Feature
body:
  - type: markdown
    attributes:
      value: "Write in English. Set Meets and exactly one milestone; link the parent epic as a sub-issue if there is one. Set Business value, Time criticality, Risk reduction and Job size in the project before the feature is pulled; WSJF follows from them."
  - type: dropdown
    id: feature_type
    attributes:
      label: Feature type
      description: "Business: delivers a benefit to a user. Enabler: technical groundwork that later business features need."
      options:
        - Business
        - Enabler
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: Benefit hypothesis
      description: "We believe <benefit> if <feature>."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "One checkbox per criterion, e.g. '- [ ] Refuses X with reason Y'. Tick it when its test is green."
    validations:
      required: true
  - type: input
    id: catalog
    attributes:
      label: Catalog feature
      description: "The one product catalog feature this delivers, with its id and link."
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: "The requirement ids this feature meets, one per line; the same ids go into the project field Meets."
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: "Every ADR, document and section this feature changes or relies on, one per line with its path and section. Write 'none' only if none, never leave it out."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: "What this deliberately does not cover. Write 'none' if none."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Why this exists and where it comes from: owner decisions (quote and date), Hindsight records, documents, related tickets. Needed later for Flightplan."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: "Tickets or branches this depends on, and what depends on it. Write 'none' if none."
    validations:
      required: true
