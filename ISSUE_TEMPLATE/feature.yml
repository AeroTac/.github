name: Feature
description: A part of an epic (a plan task); fits in one PI.
title: "<feature title>"
type: Feature
body:
  - type: markdown
    attributes:
      value: "Write in English. Set Estimate d, Meets and the PI milestone; link the parent epic as a sub-issue."
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] AC1: 
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Why this exists and where it comes from: requirement ids (Manifest), owner decisions (quote and date), Hindsight records, documents, related tickets. Needed later for Flightplan."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: "Tickets or branches this depends on, and what depends on it. Write 'none' if none."
    validations:
      required: true
