name: Epic
description: A large initiative of a product; may span several PIs.
title: "<epic title>"
type: Epic
body:
  - type: markdown
    attributes:
      value: "Write in English. Its features are linked as sub-issues; PI objectives live in the PI milestone."
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "One checkbox per criterion, e.g. '- [ ] Refuses X with reason Y'. Tick it when its test is green."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: "What this deliberately does not cover. Write 'none' if none."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Why this exists and where it comes from: requirement ids (Manifest), owner decisions (quote and date), Hindsight records, documents, related tickets. Needed later for Flightplan."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: "Tickets or branches this depends on, and what depends on it. Write 'none' if none."
    validations:
      required: true
