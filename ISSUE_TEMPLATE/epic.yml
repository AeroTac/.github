name: Epic
description: A large initiative of a product, done when it is decided done. It carries no time information.
title: "<epic title>"
type: Epic
body:
  - type: markdown
    attributes:
      value: "Write in English. An epic carries no time information: no date, no duration, no program increment and no milestone; leave the project fields Start date and Target date empty. Its features are linked as sub-issues. Set Business value, Time criticality, Risk reduction and Job size in the project before the epic is pulled; WSJF follows from them. An epic is done when it is decided done: once all its features are implemented, an evaluation decides how it goes on, and its result is written under Evaluation."
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: "We believe that <outcome> will happen if <solution>."
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
    validations:
      required: true
  - type: textarea
    id: indicators
    attributes:
      label: Leading indicators
      description: "What we measure early to see whether the hypothesis holds: the measure, how it is taken, the threshold."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "One checkbox per criterion, e.g. '- [ ] Refuses X with reason Y'. Tick it when its test is green."
    validations:
      required: true
  - type: textarea
    id: catalog
    attributes:
      label: Catalog features
      description: "The product catalog features this epic delivers, one per line with its id and link."
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: "The requirement ids this epic meets, one per line; the same ids go into the project field Meets."
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: "Every ADR, document and section this epic changes or relies on, one per line with its path and section. Write 'none' only if none, never leave it out."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: "What this deliberately does not cover. Write 'none' if none."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Why this exists and where it comes from: owner decisions (quote and date), Hindsight records, documents, related tickets. Needed later for Flightplan."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: "Tickets or branches this depends on, and what depends on it. Write 'none' if none."
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: Evaluation
      description: "Left empty when the epic is cut. Due once all its features are implemented: what was reached against the outcome, the leading indicators and the acceptance criteria, and the owner's decision on how the epic goes on."
    validations:
      required: false
